<!doctype html><html lang="en" data-reader-theme="dark" data-font-size="medium" data-text-width="normal" data-line-height="normal"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Read serialized fiction on MaxQuill."><meta name="theme-color" content="#0c0b0a"><title>Reader | MaxQuill</title><link rel="stylesheet" href="styles.css"></head>
<body class="reader-page"><header class="reader-header"><a class="wordmark" href="index.html">MAXQUILL</a><button class="settings-toggle" type="button" aria-expanded="false" aria-controls="reader-settings">Reading settings</button></header><aside class="reader-settings" id="reader-settings" aria-label="Reading settings" hidden>
<div class="setting-group"><span id="theme-label">Theme</span><div class="segmented" role="group" aria-labelledby="theme-label"><button type="button" data-setting="theme" data-value="dark">Dark</button><button type="button" data-setting="theme" data-value="light">Light</button><button type="button" data-setting="theme" data-value="sepia">Sepia</button></div></div>
<div class="setting-group"><span id="font-label">Font size</span><div class="segmented" role="group" aria-labelledby="font-label"><button type="button" data-setting="fontSize" data-value="small">Small</button><button type="button" data-setting="fontSize" data-value="medium">Medium</button><button type="button" data-setting="fontSize" data-value="large">Large</button><button type="button" data-setting="fontSize" data-value="xlarge">Extra large</button></div></div>
<div class="setting-group"><span id="width-label">Text width</span><div class="segmented" role="group" aria-labelledby="width-label"><button type="button" data-setting="textWidth" data-value="narrow">Narrow</button><button type="button" data-setting="textWidth" data-value="normal">Normal</button><button type="button" data-setting="textWidth" data-value="wide">Wide</button></div></div>
<div class="setting-group"><span id="line-label">Line height</span><div class="segmented" role="group" aria-labelledby="line-label"><button type="button" data-setting="lineHeight" data-value="compact">Compact</button><button type="button" data-setting="lineHeight" data-value="normal">Normal</button><button type="button" data-setting="lineHeight" data-value="relaxed">Relaxed</button></div></div></aside><main id="reader-content" aria-live="polite"><p class="loading reader-loading">Opening chapter&hellip;</p></main><script src="reader.js" defer></script></body></html>
